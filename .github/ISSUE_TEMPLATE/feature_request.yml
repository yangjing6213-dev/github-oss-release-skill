name: Feature request
description: Propose a narrowly scoped improvement to the Skill.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Explain the ordinary-user task and preserve the read-only and fail-closed safety boundary.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user task is currently blocked or unnecessarily difficult?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and safety impact
      description: Include affected task types, gates, and tests.
    validations:
      required: true
